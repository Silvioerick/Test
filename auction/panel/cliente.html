<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Área do Cliente — DigitalSac Leilões</title>
<!-- Vue servido pelo próprio servidor, não por CDN de terceiros: o
     painel precisa abrir em rede restrita e sem depender de um host
     externo estar no ar. O integrity fecha o caso mesmo servindo local. -->
<script src="vendor/vue-3.4.21.prod.js"
        integrity="sha384-6pS1WSZJY7wOk6qQTa9C9U2W1/qzqL7iYoMil7qn9KFeN5fZDAwIExgCd7U5AH+X"
        crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --border: #2a2f3a;
    --text: #e7e9ee; --muted: #9aa3b2; --accent: #4f8cff;
    --ok: #34c77b; --warn: #f2b84b; --danger: #f2555a;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #app { max-width: 480px; margin: 0 auto; padding: 32px 16px 64px; }
  .wide { max-width: 720px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; text-align:center; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; text-align:center; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:24px; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
  input { width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:12px 14px; font-size:16px; margin-bottom:16px; }
  input:focus { outline:none; border-color:var(--accent); }
  input.code { text-align:center; letter-spacing:6px; font-size:22px; font-weight:600; }
  button { width:100%; background:var(--accent); color:#fff; border:none; border-radius:10px; padding:13px;
    font-size:15px; font-weight:600; cursor:pointer; }
  button:hover { filter:brightness(1.08); }
  button:disabled { opacity:.5; cursor:default; }
  button.link { background:none; color:var(--muted); font-weight:400; font-size:13px; padding:8px; width:auto; margin:0 auto; display:block; }
  .msg { font-size:13px; padding:10px 12px; border-radius:8px; margin-bottom:16px; }
  .msg.err { background:#f2555a22; color:#f78a8d; }
  .msg.ok { background:#34c77b22; color:#5fe0a0; }
  .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .top button { width:auto; padding:8px 14px; font-size:13px; }
  .profile-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .profile-row .l { color:var(--muted); }
  .lot-card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:12px; }
  .lot-card .head { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; }
  .lot-card .name { font-weight:600; font-size:14px; }
  .badge { display:inline-block; padding:3px 10px; border-radius:99px; font-size:11px; font-weight:600; white-space:nowrap; }
  .b-won-paid { background:#34c77b33; color:#5fe0a0; }
  .b-won-pending { background:#f2b84b33; color:#f2c96b; }
  .b-won-expired { background:#f2555a33; color:#f78a8d; }
  .b-lost { background:#8888; color:var(--muted); }
  .row { display:flex; justify-content:space-between; font-size:13px; padding:3px 0; color:var(--muted); }
  .row b { color:var(--text); font-weight:600; }
  .empty { color:var(--muted); font-size:13px; padding:40px 0; text-align:center; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const { createApp, ref, reactive, onMounted } = Vue;

const DEFAULT_API_BASE = ""; // mesma origem; o servidor serve esta página

function money(cents) {
  if (cents === null || cents === undefined) return "—";
  return (cents / 100).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}
function fmtDate(iso) {
  if (!iso) return "—";
  return new Date(iso).toLocaleString("pt-BR");
}

// Resume o status de um lote na visão do cliente: ganhou e pagou, ganhou e
// está pendente, ganhou mas não pagou a tempo, ou simplesmente não ganhou.
function situacao(lot) {
  if (!lot.won) return { label: "Não venceu", cls: "b-lost" };
  if (lot.payment_status === "paid") return { label: "Pago", cls: "b-won-paid" };
  if (lot.payment_status === "expired" || lot.lot_status === "unsold") return { label: "Não pago a tempo", cls: "b-won-expired" };
  if (lot.payment_status === "pending") return { label: "Aguardando pagamento", cls: "b-won-pending" };
  return { label: "Aguardando cadastro", cls: "b-won-pending" };
}

const App = {
  setup() {
    const apiBase = ref(localStorage.getItem("cliente_api_base") || DEFAULT_API_BASE);
    const token = ref(localStorage.getItem("cliente_session") || "");
    const step = ref(token.value ? "extrato" : "telefone"); // telefone -> codigo -> extrato
    const phone = ref("");
    const code = ref("");
    const message = reactive({ text: "", type: "ok" });
    const profile = ref(null);
    const history = ref([]);
    const loading = ref(false);

    function flash(text, type = "err") { message.text = text; message.type = type; }

    async function api(path, opts = {}) {
      const res = await fetch(apiBase.value + path, {
        ...opts,
        headers: {
          "Content-Type": "application/json",
          ...(token.value ? { Authorization: "Bearer " + token.value } : {}),
          ...(opts.headers || {}),
        },
      });
      let body = null;
      try { body = await res.json(); } catch (_) {}
      if (!res.ok) throw new Error((body && body.error) || ("HTTP " + res.status));
      return body;
    }

    async function requestCode() {
      if (!phone.value.trim()) return flash("Informe seu número de WhatsApp");
      loading.value = true;
      try {
        await api("/api/customer/login/request", { method: "POST", body: JSON.stringify({ phone: phone.value }) });
        message.text = ""; step.value = "codigo";
      } catch (e) { flash(e.message); }
      finally { loading.value = false; }
    }

    async function verifyCode() {
      if (code.value.trim().length !== 6) return flash("Digite os 6 dígitos do código");
      loading.value = true;
      try {
        const out = await api("/api/customer/login/verify", { method: "POST", body: JSON.stringify({ phone: phone.value, code: code.value }) });
        token.value = out.session_token;
        localStorage.setItem("cliente_session", token.value);
        message.text = "";
        await loadAll();
        step.value = "extrato";
      } catch (e) { flash(e.message); }
      finally { loading.value = false; }
    }

    async function loadAll() {
      profile.value = await api("/api/customer/me");
      history.value = await api("/api/customer/history");
    }

    async function logout() {
      // Revoga a sessão no servidor também: limpar só o navegador deixava
      // o token válido por 24h para quem o tivesse copiado.
      try { await api("/api/customer/logout", { method: "POST", body: "{}" }); } catch (e) { /* segue o logout local */ }
      token.value = ""; localStorage.removeItem("cliente_session");
      phone.value = ""; code.value = ""; step.value = "telefone";
      profile.value = null; history.value = [];
    }

    onMounted(async () => {
      if (token.value) {
        try { await loadAll(); step.value = "extrato"; }
        catch (_) { logout(); } // sessão vencida
      }
    });

    return { apiBase, step, phone, code, message, profile, history, loading,
      requestCode, verifyCode, logout, money, fmtDate, situacao };
  },
  template: `
  <div :class="{ wide: step === 'extrato' }">
    <h1>Área do Cliente</h1>
    <div class="sub">Seus lances, o que você ganhou e a situação do pagamento.</div>

    <div v-if="message.text" :class="['msg', message.type]">{{ message.text }}</div>

    <div v-if="step === 'telefone'" class="card">
      <label>Seu número de WhatsApp</label>
      <input v-model="phone" placeholder="(11) 99999-9999" @keyup.enter="requestCode">
      <button @click="requestCode" :disabled="loading">Receber código no WhatsApp</button>
    </div>

    <div v-else-if="step === 'codigo'" class="card">
      <label>Digite o código de 6 dígitos que mandamos no seu WhatsApp</label>
      <input v-model="code" class="code" maxlength="6" inputmode="numeric" placeholder="000000" @keyup.enter="verifyCode">
      <button @click="verifyCode" :disabled="loading">Entrar</button>
      <button class="link" @click="step='telefone'">Usar outro número</button>
    </div>

    <div v-else>
      <div class="top">
        <div>
          <div style="font-weight:600">{{ profile?.name || profile?.jid }}</div>
          <div style="font-size:12px;color:var(--muted)">{{ profile?.jid }}</div>
        </div>
        <button @click="logout">Sair</button>
      </div>

      <div class="card" v-if="profile && !profile.registered" style="margin-bottom:16px">
        <div class="msg warn" style="background:#f2b84b22;color:#f2c96b;margin:0">
          Cadastro incompleto. Se você ganhar um lote, vamos te mandar um link pra completar endereço e documento.
        </div>
      </div>

      <div v-if="!history.length" class="empty">Você ainda não deu nenhum lance.</div>

      <div v-for="h in history" :key="h.lot_id" class="lot-card">
        <div class="head">
          <div class="name">{{ h.product_name }}</div>
          <span :class="['badge', situacao(h).cls]">{{ situacao(h).label }}</span>
        </div>
        <div class="row"><span>Seu lance</span><b>{{ money(h.your_bid_cents) }}</b></div>
        <div class="row" v-if="h.won && h.charge_cents"><span>Total cobrado (produto + frete)</span><b>{{ money(h.charge_cents) }}</b></div>
        <div class="row" v-if="h.won && h.discount_cents"><span>Desconto de frete</span><b>-{{ money(h.discount_cents) }}</b></div>
        <div class="row"><span>Leilão em</span><span>{{ fmtDate(h.opened_at) }}</span></div>
      </div>
    </div>
  </div>
  `,
};

createApp(App).mount("#app");
</script>
</body>
</html>
